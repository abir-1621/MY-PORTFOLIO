<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10130f">
    <meta name="description" content="Notes by Md Abir on product engineering, data, AI, and business operations.">
    <meta name="author" content="Md Abir">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Article | Md Abir</title>
</head>
<body class="article-page">
    <a class="skip-link" href="#article-content">Skip to article</a>

    <header class="article-header">
        <nav class="shell article-nav" aria-label="Article navigation">
            <a class="wordmark" href="index.html#top" aria-label="Md Abir, portfolio"><span>MA</span><i aria-hidden="true"></i></a>
            <a class="article-back" href="index.html#top">Back to portfolio <span aria-hidden="true">↗</span></a>
        </nav>

        <div class="shell article-hero">
            <div class="article-meta" id="article-meta"></div>
            <h1 id="article-title"></h1>
            <p id="article-description"></p>
        </div>
    </header>

    <main class="shell article-main">
        <article class="article-content" id="article-content"></article>
        <aside class="article-aside">
            <span>Written by</span>
            <strong>Md Abir</strong>
            <p>Data and AI engineer, product builder, and M.Sc. Data Science student at FAU.</p>
            <a href="mailto:abirkhan88821@gmail.com">Start a conversation ↗</a>
        </aside>
    </main>

    <footer class="site-footer">
        <div class="shell footer-grid">
            <a class="wordmark wordmark-light" href="index.html#top" aria-label="Portfolio home"><span>MA</span><i aria-hidden="true"></i></a>
            <p>© <span id="current-year">2026</span> Md Abir</p>
            <a href="index.html#top">Portfolio ↑</a>
        </div>
    </footer>

    <script src="js/portfolio-data.js"></script>
    <script>
        (function () {
            'use strict';
            const params = new URLSearchParams(window.location.search);
            const articles = window.portfolioData?.articles || [];
            const article = articles.find((item) => item.slug === params.get('slug'));

            if (!article) {
                document.getElementById('article-title').textContent = 'Article coming soon';
                document.getElementById('article-description').textContent = 'Please check back later.';
                return;
            }

            document.title = `${article.title} | Md Abir`;
            document.querySelector('meta[name="description"]').content = article.description;
            document.getElementById('article-title').textContent = article.title;
            document.getElementById('article-description').textContent = article.description;

            const meta = document.getElementById('article-meta');
            [article.category, article.readTime, article.status].forEach((value) => {
                const span = document.createElement('span');
                span.textContent = value;
                meta.appendChild(span);
            });

            const content = document.getElementById('article-content');
            article.content.forEach((paragraph) => {
                const element = document.createElement('p');
                element.textContent = paragraph;
                content.appendChild(element);
            });

            document.getElementById('current-year').textContent = String(new Date().getFullYear());
        })();
    </script>
</body>
</html>
