<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1584, initial-scale=1">
  <title>HPF LinkedIn cover</title>
  <style>
    :root {
      --hpf-orange: #EF8B00;
      --hpf-grey: #373C42;
      --hpf-silver: #908F8F;
      --white: #FFFFFF;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 1584px;
      height: 396px;
      margin: 0;
      overflow: hidden;
      background: var(--white);
    }

    .cover {
      position: relative;
      width: 1584px;
      height: 396px;
      background: var(--white);
      font-family: Avenir, "Avenir Next", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .logo {
      position: absolute;
      top: 48px;
      right: 72px;
      width: 292px;
      height: auto;
    }

    .copy {
      position: absolute;
      left: 500px;
      right: 72px;
      top: 163px;
    }

    h1 {
      margin: 0;
      color: var(--hpf-grey);
      font-size: 58px;
      font-weight: 800;
      letter-spacing: -1.1px;
      line-height: 1.05;
    }

    p {
      margin: 18px 0 0;
      color: var(--hpf-silver);
      font-size: 29px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <main class="cover" aria-label="LinkedIn cover for an HPF automation engineer">
    <img class="logo" src="hpf-logo-full-orange.png" alt="Hasso Plattner Foundation">
    <div class="copy">
      <h1>Automation Engineer</h1>
      <p>Former Co-Founder &amp; CEO</p>
    </div>
  </main>
</body>
</html>
